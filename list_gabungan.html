<!DOCTYPE html>
<html>
    <head>
        <title>Orderlist and Unorderlist HTML</title>
        <style>
            ul{
                list-style-type: square;
            }
            ol.a{
                list-style:upper-roman;
            }
        </style>
    </head>
    <body>
        <h2>Menu Makanan dan Minuman</h2>
        <p>Makanan</p>
        <ol>
            <li>MCD</li>
            <ul>
                <li>Ayam Paha</li>
                <li>McFlurry</li>
                <li>Kentang goreng</li>
            </ul>
            <li>Wingstop</li>
            <ol class="a">
                <li>Garlic Parmesan</li>
                <li>Lemon Pepper</li>
                <li>Kentang goreng</li>
            </ol>
        </ol>
        <p>Minuman</p>
        <ul>
            <li>Air putih</li>
            <li>Es teh manis</li>
            <li>Lemon tea</li>
        </ul>

        <h2>Icon pada HTML</h2>
        
    </body>
</html>
