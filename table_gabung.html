<!DOCTYPE html>
<html>
    <head>
        <title>Colspan dan Rowspan</title>
        <link rel="stylesheet" href="table_gabung.css">
    </head>
    <body>
        <h2>Colspan dan Rowspan pada Table</h2>
        <!-- colspan : menggabungkan kolom
             rowspan : menggabungkan baris -->
        <table>
            <tr>
                <th rowspan="2">No</th>
                <th rowspan="2">Nama</th>
                <th colspan="2">Nilai</th>
            </tr>
            <tr>
                <th>Ulangan 1</th>
                <th>Ulangan 2</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Sherly</td>
                <td>97</td>
                <td>96</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Monica</td>
                <td>95</td>
                <td>91</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Karen</td>
                <td>92</td>
                <td>94</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Angie</td>
                <td>96</td>
                <td>88</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Harper</td>
                <td>89</td>
                <td>90</td>
            </tr>
        </table>
    </body>
</html>
