<!DOCTYPE html>
<html>
    <head>
    <title>Table Marge</title>
    <link rel="stylesheet" href="tablemarge.css">
    </head>
    <body>
        <table>
            <tr>
                <th rowspan="3">A</th>
                <th rowspan="2">B</th>
                <th colspan="2">C</th>
                <th rowspan="3">D</th>
                <th rowspan="4">E</th>
                <th rowspan="2">N</th>
                <th rowspan="6">H</th>
            </tr>
            <tr>
                <th rowspan="1">F</th>
                <th rowspan="1">G</th>
            </tr>
            <tr>
                <th rowspan="1">I</th>
                <th rowspan="1">J</th>
                <th rowspan="1">K</th>
                <th rowspan="2">O</th>
            </tr>
            <tr>
                <th colspan="5">M</th>
            </tr>
            <tr>
                <th rowspan="2">P</th>
                <th colspan="2">Q</th>
                <th rowspan="2">R</th>
                <th>U</th>
                <th>V</th>
                <th>W</th>
            </tr>
        </table>
    </body>
</html>
